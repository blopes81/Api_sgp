version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - USE_MOCK_DATA=true
      - API_KEY=sua-chave-api-secreta
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

